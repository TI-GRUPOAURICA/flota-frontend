<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Vehicular - Grupo Aurica</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="assets/css/global.css">

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#345D9D">
    <link rel="apple-touch-icon" href="assets/img/icon-192x192.png">
    <style>
        /* Estilos específicos de index.html */
        body { padding: 0 !important; margin: 0 !important; overflow-x: hidden; }

        #login-view {
            display: none; /* Oculto por defecto para evitar parpadeo */
            width: 100vw;
            height: 100vh;
        }

        .login-left-panel {
            flex: 0 0 45%;
            background-color: var(--aurica-blue);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 2rem;
            box-sizing: border-box;
        }

        .login-right-panel {
            flex: 1;
            background-color: var(--aurica-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .main-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo-container img.main-logo {
            max-width: 450px;
            width: 100%;
            height: auto;
            margin-bottom: 0;
            filter: brightness(0) invert(1);
        }

        .sub-logos-container {
            margin-top: -1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sub-logos-container img {
            max-width: 280px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .login-box-right {
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .login-title {
            color: var(--aurica-blue);
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .btn-microsoft-large {
            background: var(--aurica-blue);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 800;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            width: 100%;
        }

        .btn-microsoft-large:hover {
            background: var(--aurica-blue-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-microsoft-large img {
            width: 24px;
            background: white;
            border-radius: 4px;
            padding: 2px;
        }

        /* Responsive login */
        @media (max-width: 900px) {
            #login-view {
                flex-direction: column;
            }
            .login-left-panel {
                padding: 40px 20px;
            }
            .login-right-panel {
                padding: 40px 20px;
            }
            .login-title {
                font-size: 32px;
            }
        }

    </style>
</head>

<body>

    <div id="login-view">
        <div class="login-left-panel">
            <div class="main-logo-container">
                <img src="assets/img/logo-aurica.png" alt="Grupo Aurica" class="main-logo" id="main-logo-img" onerror="this.onerror=null; this.src='https://placehold.co/350x120/345D9D/FFF?text=GRUPO+AURICA';">
            </div>
            <div class="sub-logos-container">
                <img src="assets/img/logo-sub1.png" alt="Logos Secundarios" onerror="this.style.display='none';">
            </div>
        </div>
        <div class="login-right-panel">
            <div class="login-box-right">
                <div class="login-title">Portal Vehicular</div>
                <div class="login-subtitle">Sistema de gestión vehicular</div>
                
                <button class="btn-microsoft-large" onclick="iniciarSesionMicrosoft()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft">
                    Iniciar sesión con Microsoft
                </button>
            </div>
        </div>
    </div>



    <script>
        const currentOrigin = window.location.origin;
        const redirect = currentOrigin.includes('localhost') || currentOrigin.includes('127.0.0.1') ? currentOrigin : "https://gestionvehicular.auricasac.com/";
        const msalConfig = {
            auth: {
                clientId: "e0067a91-7c99-4c69-8ded-462444192826",
                authority: "https://login.microsoftonline.com/104ca696-0629-4bad-9210-a7233a858def",
                redirectUri: redirect
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        const accounts = msalInstance.getAllAccounts();
        
        // Manejar cierre de sesión si viene con el parámetro ?logout=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            sessionStorage.removeItem('flotapro_session');
            sessionStorage.removeItem('flotapro_permisos');
            if (accounts.length > 0) {
                const logoutRequest = { account: accounts[0] };
                msalInstance.logoutPopup(logoutRequest).then(() => {
                    window.location.href = window.location.origin + window.location.pathname; // Limpiar URL
                });
            } else {
                document.getElementById('login-view').style.display = 'flex';
            }
        } else {
            // Flujo normal de login
            if (accounts.length > 0) { 
                redirigirADashboard(accounts[0].username.toLowerCase()); 
            } else {
                document.getElementById('login-view').style.display = 'flex';
            }
        }

        async function iniciarSesionMicrosoft() {
            try {
                const loginResponse = await msalInstance.loginPopup({ scopes: ["User.Read"] });
                redirigirADashboard(loginResponse.account.username.toLowerCase());
            } catch (error) { alert("La autenticación falló."); }
        }

        async function redirigirADashboard(email) {
            // 🔒 SESIÓN: Guardar en sessionStorage para validar en módulos
            sessionStorage.setItem('flotapro_session', JSON.stringify({ email: email, timestamp: Date.now() }));

            // 4. OBTENER PERMISOS DESDE EL BACKEND (Solo la primera vez, se puede cachear si se desea)
            const API_URL = "https://flota-backend-xecu.onrender.com";
            try {
                const response = await fetch(`${API_URL}/permisos/${email}`);
                const data = await response.json();
                if (data.status === "success") {
                    sessionStorage.setItem('flotapro_permisos', JSON.stringify(data.data));
                }
            } catch (error) {
                console.error("Error obteniendo permisos:", error);
            }

            // REDIRECCIÓN FINAL AL DASHBOARD
            window.location.href = 'dashboard.html';
        }

        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registrado con éxito: ', registration.scope);
                }, err => {
                    console.log('Fallo al registrar el ServiceWorker: ', err);
                });
            });
        }
    </script>
</body>

</html>
